
# ==========================================
# STARSHIP - HINTERLANDS HACKER EDITION
# ==========================================

add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$status\
$fill\
$cmd_duration\
$line_break\
$character"""

# Directory
[directory]
truncation_length = 2
truncation_symbol = "…/"
truncate_to_repo = true
style = "bold white"
repo_root_style = "bold white"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

# Git branch
[git_branch]
symbol = "git:"
format = "[$symbol$branch]($style) "
style = "italic #b9b9b9"

# Git status
[git_status]
format = '([$all_status$ahead_behind]($style))'
style = "#a0a0a0"

ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕${ahead_count}⇣${behind_count} "

conflicted = "✖ "
up_to_date = ""

untracked = "?${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "
stashed = ""

# Fill
[fill]
symbol = " "

# Command duration
[cmd_duration]
min_time = 1000
show_milliseconds = true
show_notifications = false
style = "#686868"
format = "[󰔛 $duration]($style) "

# Prompt character
[character]
success_symbol = "[❯](bold white)"
error_symbol = "[❯](bold #7c7c7c)"
vimcmd_symbol = "[❮](bold white)"

# Disable unnecessary modules
[username]
disabled = true

[hostname]
disabled = true

[os]
disabled = true

[package]
disabled = true

[time]
disabled = true

# Command exit status
[status]
disabled = false
format = '[$symbol$status]($style) '
symbol = '✖ '
style = 'bold #7c7c7c'
recognize_signal_code = true

# Node.js
[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "#8b8b8b"

# Python
[python]
symbol = " "
format = '[$symbol$version( \($virtualenv\))]($style) '
style = "#8b8b8b"